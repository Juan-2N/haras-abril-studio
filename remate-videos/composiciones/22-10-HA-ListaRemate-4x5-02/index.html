    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: var(--ha-black); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ha-black); }

      /* Fondo: foto del lote a toda altura (más ancha que el lienzo) con paneo lateral */
      #bg { position: absolute; left: 0; top: 0; height: 100%; width: auto; max-width: none; }
      /* Velo multiply al 90 % (pedido: #2D2722 ≈ --ha-ink #2C2723) */
      #tint { position: absolute; inset: 0; background: var(--ha-ink); mix-blend-mode: multiply; opacity: 0.9; }
      #veil { position: absolute; inset: 0; background: var(--ha-black); }

      /* Encabezado y tarjetas (sub-composiciones) */
      #encabezado { position: absolute; left: 0; top: 76px; width: 1080px; height: 200px; }
      /* Tarjetas más anchas que el margen de marca (108 px) a pedido: 1016 px centradas, 232 de alto */
      .lote { position: absolute; left: 32px; width: 1016px; height: calc(var(--ha-lot-card-h) + 14px); }
      #lote-1 { top: 290px; }
      #lote-2 { top: 534px; }
      #lote-3 { top: 778px; }
      #lote-4 { top: 1022px; }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Paneo lateral continuo: la cámara recorre la foto de la grupa a la cabeza
      tl.fromTo("#bg", { x: 0 }, { x: -600, duration: 8, ease: "none" }, 0);
      // Entrada: fundido corto desde negro (el primer frame es la miniatura del carrusel)
      tl.fromTo("#veil", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.out" }, 0);
      // Salida: fundido a negro
      tl.to("#veil", { opacity: 1, duration: 0.8, ease: "power1.in" }, 7.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
