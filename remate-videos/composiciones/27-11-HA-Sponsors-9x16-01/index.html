      <!-- Música: Battleborn Symphony (la de los videos de lote), con fundido de entrada y de salida -->
      <audio data-hf-id="hf-6exa" id="musica" src="assets/musica/battleborn-symphony.mp3"
             data-start="0" data-duration="30" data-track-index="10" data-volume="0.8"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.6,"v":1},{"t":27,"v":1},{"t":29.6,"v":0}]}]}'></audio>

    <script>
      const F = 1 / 30, DUR = 30, TAPA = 3;
      // Cinta: 100 px/s, constante. En TAPA la copia B arranca en x = -391.5 (Equi-Care en x = -360, como en el PDF).
      // Con 1080 px de ancho hace falta más velocidad que en el 16:9 para que pasen los 21: Equi-Care, La Lucrecia y
      // Equibox vuelven a entrar al final con la copia C
      const SET = 3389.8, VEL = 100, X_TAPA = -391.5 - SET;

      // Estados iniciales (una tl.set() en 0 no aplica en el frame 0)
      gsap.set("#pista", { x: X_TAPA });

      const anim = gsap.timeline({ paused: true });
      const entra = (sel, t, extra = {}) =>
        anim.fromTo(sel, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out", ...extra }, t);
      // Letras: arrancan separadas y se cierran hasta su lugar; al salir se vuelven a abrir
      const abre = (paso) => (i, el, all) => (i - (all.length - 1) / 2) * paso;

      // Fondo: acercamiento lento
      anim.fromTo("#fondo", { scale: 1 }, { scale: 1.06, duration: DUR, ease: "none" }, 0);

      // Cinta: la banda aparece, los filetes dorados se dibujan desde el centro y los logos corren todo el tiempo
      anim.fromTo("#banda", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      anim.fromTo(".filete", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 0.1);
      anim.fromTo(".hilo", { opacity: 0 }, { opacity: 0.35, duration: 0.6, ease: "power2.out" }, 0.3);
      anim.fromTo("#cinta", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.4);
      anim.fromTo("#pista", { x: X_TAPA + VEL * TAPA }, { x: X_TAPA + VEL * (TAPA - DUR), duration: DUR, ease: "none" }, 0);

      // Encabezado: sello desde un punto; logotipo y CSI suben; línea desde el centro; estrella al final
      anim.fromTo("#sello", { opacity: 0, scale: 0.04 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.15);
      entra("#logotipo", 0.35);
      entra("#csi", 0.35);
      anim.fromTo("#linea-ha", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.55);
      anim.fromTo("#estrella-ha", { opacity: 0, scale: 0.6, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, 0.8);

      // REMATE 2026
      anim.fromTo("#ev-remate .l", { opacity: 0, x: abre(70) }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 0.6);
      anim.fromTo("#an-remate .l", { opacity: 0, x: abre(70) }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 0.85);
      entra("#frase-remate", 1.4, { duration: 0.9 });

      // Cambio a CONCURSO CSI 1★, en la subida de la música (13,3 a 14,5 s)
      anim.to("#ev-remate .l", { opacity: 0, x: abre(40), duration: 0.5, ease: "power2.in" }, 13.3);
      anim.to("#an-remate .l", { opacity: 0, x: abre(40), duration: 0.5, ease: "power2.in" }, 13.35);
      anim.to("#frase-remate", { opacity: 0, duration: 0.5, ease: "power2.in" }, 13.2);
      anim.fromTo("#ev-csi .l", { opacity: 0, x: abre(70) }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 13.9);
      anim.fromTo("#an-csi span.l", { opacity: 0, x: abre(70) }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 14.15);
      anim.fromTo("#an-csi .estrella-csi", { opacity: 0, scale: 0.6, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "expo.out", transformOrigin: "50% 50%" }, 14.5);
      entra("#frase-csi", 14.7, { duration: 0.9 });

      // Salida a negro; el último medio segundo queda limpio
      anim.fromTo("#fin", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.in" }, 28.8);

      // Tapa en el frame 0 (miniatura de IG): la pieza armada, como en el PDF. Desde el frame 1, la animación
      const tl = gsap.timeline({ paused: true });
      tl.add(anim.tweenFromTo(TAPA, TAPA, { duration: F, ease: "none" }), 0);
      tl.add(anim.tweenFromTo(0, DUR - F, { duration: DUR - F, ease: "none" }), F);
      tl.set("#tapa", { opacity: 0 }, F / 2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
