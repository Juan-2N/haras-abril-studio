    <meta charset="UTF-8" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="brand/tokens.css" />
    <style>
      /* Portada v2 (videosreferencias/lista/28_10_HA_Listas_Portada.png):
         foto aérea a sangre con velo, sello, REMATE / 2026 y botón. Sin panel.
         --dy corre todo el bloque en vertical (0 en 4:5; la 9:16 lo baja a su zona segura). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: var(--ha-charcoal); }
      #root { --dy: 0px; position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ha-charcoal); }

      #foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; will-change: transform; }
      #velo { position: absolute; inset: 0; background: var(--ha-ink); mix-blend-mode: multiply; opacity: 0.7; }

      /* Sello: el PNG trae aire alrededor; 406 px de imagen = 356 px de círculo (como el diseño) */
      #sello { position: absolute; left: 337px; top: calc(254px + var(--dy)); width: 406px; height: 406px; }

      .linea { position: absolute; left: 0; right: 0; display: flex; justify-content: center; white-space: nowrap; color: var(--ha-white); line-height: var(--ha-lh-tight); }
      /* REMATE: Bold, tracking abierto (se arma por letra para animar la apertura) */
      #evento { top: calc(658px + var(--dy)); font-family: var(--ha-font-sans); font-weight: var(--ha-t-event-weight); font-size: calc(var(--ha-t-event-size) * 1.43); }
      #evento .ch { display: block; margin-right: var(--ha-t-label-track); }
      #evento .ch:last-child { margin-right: 0; }
      /* 2026: Regular */
      #anio {
        top: calc(793px + var(--dy)); font-family: var(--ha-font-sans); font-weight: var(--ha-t-year-weight);
        font-size: var(--ha-t-count-size); letter-spacing: var(--ha-t-year-track); text-indent: var(--ha-t-year-track);
      }

      #boton {
        position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content;
        top: calc(980px + var(--dy)); height: var(--ha-btn-h); padding: 0 var(--ha-s-6);
        border-radius: var(--ha-btn-radius); background: var(--ha-gold-grad);
        display: flex; align-items: center; gap: var(--ha-s-3);
        font-family: var(--ha-font-sans); font-weight: var(--ha-t-label-weight);
        font-size: var(--ha-t-label-size); letter-spacing: var(--ha-t-data-track);
        color: var(--ha-white); text-transform: uppercase; line-height: 1;
      }

      #veil { position: absolute; inset: 0; background: var(--ha-black); opacity: 0; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-gxyp" id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1350">
      <img data-hf-id="hf-weh0" id="foto" class="clip" data-start="0" data-duration="8" data-track-index="0"
           src="assets/fotos/dron-haras-boxes-pistas.jpg" alt="" />
      <div data-hf-id="hf-th1h" id="velo" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>

      <img data-hf-id="hf-e5gi" id="sello" class="clip" data-start="0" data-duration="8" data-track-index="2"
           src="brand/logos/PNG/HA_Emblema_Dorado_Negativo.png" alt="Haras Abril" />
      <div data-hf-id="hf-udw1" id="evento" class="linea clip" data-start="0" data-duration="8" data-track-index="3">
        <span data-hf-id="hf-syle" class="ch">R</span><span data-hf-id="hf-1b0z" class="ch">E</span><span data-hf-id="hf-y4kr" class="ch">M</span><span data-hf-id="hf-zpsv" class="ch">A</span><span data-hf-id="hf-vcfk" class="ch">T</span><span data-hf-id="hf-dg8j" class="ch">E</span>
      </div>
      <div data-hf-id="hf-1ag6" id="anio" class="linea clip" data-start="0" data-duration="8" data-track-index="4">2026</div>

        <span data-hf-id="hf-2rlk">Conocé la lista</span><span data-hf-id="hf-p70p">→</span>
      </div>

      <!-- Música: 9 variantes en pistas 10 a 18. Suena la que no tiene data-hidden;
           se cambian desde el ojo del timeline del Studio. Fundido de entrada y salida. -->
      <audio id="musica-gospel" src="assets/musica/saturated-gospel.mp3" data-start="0" data-duration="8" data-track-index="10" data-volume="0.8"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}' data-media-start="3.75"></audio>
      <audio id="musica-barita" src="assets/musica/barita.mp3" data-start="0" data-duration="8" data-track-index="11" data-volume="0.8" data-hidden
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}'></audio>
      <audio id="musica-battleborn" src="assets/musica/battleborn-symphony.mp3" data-start="0" data-duration="8" data-track-index="12" data-volume="0.8" data-hidden
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}'></audio>
      <audio id="musica-throne" src="assets/musica/throne-of-ashes.mp3" data-start="0" data-duration="8" data-track-index="13" data-volume="0.8" data-hidden

      <audio id="musica-paradise" src="assets/musica/paradise-circus.mp3" data-start="0" data-duration="8" data-track-index="14" data-volume="0.8" data-hidden

      <audio id="musica-ckt-rip" src="assets/musica/magnific-ckt-rip.mp3" data-start="0" data-duration="8" data-track-index="15" data-volume="0.8" data-hidden
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}'></audio>
      <audio id="musica-crownshock" src="assets/musica/magnific-crownshock.mp3" data-start="0" data-duration="8" data-track-index="16" data-volume="0.8" data-hidden
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}'></audio>
      <audio id="musica-its-coming" src="assets/musica/magnific-its-coming.mp3" data-start="0" data-duration="8" data-track-index="17" data-volume="0.8" data-hidden
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}'></audio>
      <audio id="musica-movie-time" src="assets/musica/magnific-movie-time.mp3" data-start="0" data-duration="8" data-track-index="18" data-volume="0.8" data-hidden
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":7.2,"v":1},{"t":7.95,"v":0}]}]}'></audio>

      <div data-hf-id="hf-s9r2" id="veil" class="clip" data-start="0" data-duration="8" data-track-index="6"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // La foto se ve desde el primer frame (es la miniatura del carrusel) y hace zoom out lento
      tl.fromTo("#foto", { scale: 1.12 }, { scale: 1.0, duration: 8, ease: "power1.out", force3D: true }, 0);
      // Sello: escala y giro leve
      tl.fromTo("#sello", { opacity: 0, scale: 0.6, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.0, ease: "power3.out" }, 0.2);
      // REMATE se abre desde el centro (tracking simulado con x por letra)
      tl.fromTo("#evento .ch", { opacity: 0, y: 24, x: (i) => (2.5 - i) * 22 },
        { opacity: 1, y: 0, x: 0, duration: 1.2, ease: "expo.out", stagger: 0.03 }, 0.7);
      tl.fromTo("#anio", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 1.0);
      tl.fromTo("#boton", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 1.4);
      // Salida: fundido a negro
      tl.to("#veil", { opacity: 1, duration: 0.7, ease: "power1.in" }, 7.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
