<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"palabras","type":"string","label":"Palabras (separadas por |)","default":"Genética.|Resultados.|Pedigrí.|Remate."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="../brand/tokens.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        .ep-palabra { position: absolute; left: 0; top: 860px; width: 1080px; text-align: center; white-space: nowrap;
          color: var(--ha-white); font-family: var(--ha-font-sans); font-weight: var(--ha-t-sub-weight);
          font-size: calc(var(--ha-t-sub-size) * 1.75); line-height: var(--ha-lh-tight);
          letter-spacing: var(--ha-t-lot-track); text-transform: uppercase; opacity: 0; }
        /* Línea dorada con destello bajo la palabra; se dibuja desde el centro */
        .ep-linea { position: absolute; left: 195px; top: 1052px; width: var(--ha-flare-w); height: var(--ha-flare-h);
          background: var(--ha-gold-flare); }
        .ep-contador { position: absolute; left: 0; top: 1110px; width: 1080px; text-align: center; color: var(--ha-sand);
          font-family: var(--ha-font-sans); font-weight: var(--ha-t-num-weight); font-size: var(--ha-t-label-size);
          letter-spacing: var(--ha-t-num-track); opacity: 0; }
      </style>

      <div data-hf-id="hf-4onp" id="root" data-composition-id="escena-palabras" data-width="1080" data-height="1920">
        <div data-hf-id="hf-hs5n" class="ep-linea"></div>
        <div data-hf-id="hf-1d4k" class="ep-contador"></div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="escena-palabras"]');
          const vars = window.__hyperframes.getVariables();
          const palabras = String(vars.palabras || "").split("|").filter(Boolean);
          const els = palabras.map((p) => {
            const d = document.createElement("div");
            d.className = "ep-palabra";
            d.textContent = p;
            root.appendChild(d);
            return d;
          });
          const contador = root.querySelector(".ep-contador");
          const linea = root.querySelector(".ep-linea");
          const total = String(palabras.length).padStart(2, "0");

          document.fonts.load('700 154px "Barlow Condensed"').then(() => {
            const tl = gsap.timeline({ paused: true });
            const PASO = 1.3; // 3,5 beats por palabra
            els.forEach((el, i) => {
              const t = 0.15 + i * PASO;
              tl.fromTo(el, { opacity: 0, scale: 1.12, filter: "blur(26px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, t);
              if (i < els.length - 1) {
                tl.to(el, { opacity: 0, scale: 0.94, filter: "blur(18px)", duration: 0.3, ease: "power2.in" }, t + PASO - 0.3);
              }
            });
            // Contador "01 / 04": cambia con cada palabra (valor fijado también en el seek)
            const pintar = () => {
              const i = Math.max(0, Math.min(els.length - 1, Math.floor((tl.time() - 0.15) / PASO)));
              contador.textContent = String(i + 1).padStart(2, "0") + " / " + total;
            };
            tl.eventCallback("onUpdate", pintar);
            pintar();
            tl.fromTo(contador, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.35);
            tl.fromTo(linea, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, 0.3);
            // Salida hacia la grilla
            const ultima = els[els.length - 1];
            tl.to([ultima, contador], { opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power2.in" }, 5.0);
            tl.to(linea, { scaleX: 0, duration: 0.35, ease: "power2.in" }, 5.0);
            window.__timelines["escena-palabras"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
