    <script>
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30, W = 1080, H = 1920;

      // Tapa: el cierre armado (CSS) en el frame 0; en F/2 sus capas pasan al estado inicial y arranca el video
      tl.set(["#c-fondo", "#c-velos", "#c-agua"], { opacity: 0 }, F / 2);
      tl.set(["#c-sello", "#c-estrella"], { opacity: 0, scale: 0.6 }, F / 2);
      tl.set("#c-caballo", { opacity: 0, y: 40 }, F / 2);
      tl.set("#c-textos .txt", { opacity: 0, y: 32 }, F / 2);

      // Recorte vertical que sigue al caballo. keys: [segundo en el archivo original, centro del caballo (0–1 del ancho)]
      // archivo0: segundo del original donde arranca el archivo de assets/clips.
      // inicio y mediaStart tienen que ser los data-start y data-media-start del clip: si se recorta en el Studio, actualizarlos acá.
      // Entre keys, curva suave (Hermite monótona, sin pasarse de los puntos) muestreada cuadro a cuadro: sin quiebres de velocidad
      const VW = H * 1.2 * 16 / 9;
      const seguir = (sel, inicio, mediaStart, archivo0, keys) => {
        const pts = keys.map(([s, cx]) => [inicio + (s - archivo0 - mediaStart), Math.min(0, Math.max(W - VW, W / 2 - cx * VW))]);
        const n = pts.length;
        const pend = pts.slice(1).map((p, i) => (p[1] - pts[i][1]) / (p[0] - pts[i][0]));
        const m = pts.map((_, i) => i === 0 ? pend[0] : i === n - 1 ? pend[n - 2]
          : pend[i - 1] * pend[i] <= 0 ? 0 : 2 / (1 / pend[i - 1] + 1 / pend[i]));
        const xEn = (t) => {
          let i = 0;
          while (i < n - 2 && t > pts[i + 1][0]) i++;
          const h = pts[i + 1][0] - pts[i][0], u = (t - pts[i][0]) / h;
          return (2 * u ** 3 - 3 * u ** 2 + 1) * pts[i][1] + (u ** 3 - 2 * u ** 2 + u) * h * m[i]
            + (-2 * u ** 3 + 3 * u ** 2) * pts[i + 1][1] + (u ** 3 - u ** 2) * h * m[i + 1];
        };
        gsap.set(sel, { x: pts[0][1] });
        for (let t = pts[0][0]; t < pts[n - 1][0] - 1e-6; t += F) {
          const t2 = Math.min(t + F, pts[n - 1][0]);
          tl.fromTo(sel, { x: xEn(t) }, { x: xEn(t2), duration: t2 - t, ease: "none", immediateRender: false }, t);
        }
      };
      seguir("#v-salto1", 5.6, 0.4, 8.8, [[9.2, 0.38], [10.0, 0.44], [11.4, 0.34]]);
      seguir("#v-salto2", 7.54, 0.93, 14.6, [[15.0, 0.26], [15.5, 0.30], [16.0, 0.38], [16.5, 0.45], [17.0, 0.47], [17.8, 0.54]]);
      seguir("#v-salto3", 9.91, 0.6, 18.8, [[19.4, 0.64], [20.0, 0.66], [20.75, 0.65], [21.5, 0.62], [22.2, 0.58], [22.9, 0.56]]);
      seguir("#v-salto4", 13.4, 0.4, 28.0, [[28.4, 0.32], [29.0, 0.33], [29.5, 0.40], [30.0, 0.47], [30.5, 0.57], [31.0, 0.59]]);
      seguir("#v-final", 16, 0.3, 84.4, [[84.7, 0.43], [85.25, 0.45], [85.75, 0.53], [86.25, 0.59], [87.1, 0.59]]);
      // Primer plano: solo el tramo limpio del original (88.25–89.65, antes y después hay desenfoque y la gráfica de banderas),
      // al 50 % (el original es de 60 fps). Las keys van en segundos del archivo lento, por eso archivo0 = 0
      seguir("#v-larocca", 18.4, 0.1, 0, [[0.1, 0.39], [0.7, 0.355], [1.2, 0.355], [1.7, 0.356], [2.3, 0.40], [2.7, 0.41]]);

      // Aérea de noche: recorte fijo con zoom lento (Ken Burns 1.00 → 1.06) centrado en el estadio
      const AW = 3802;
      const xNoche = Math.min(0, Math.max(W - AW, W / 2 - 0.47 * AW));
      gsap.set("#v-noche", { x: xNoche, transformOrigin: `${0.47 * AW}px ${H / 2}px` });
      tl.fromTo("#v-noche", { scale: 1 }, { scale: 1.06, duration: 3, ease: "none" }, 2.6);
      // Aérea de día: mismo encuadre que el fondo de la portada (es el cuadro del segundo 1.8 del clip = 22.8 de la pieza),
      // medido con las torres de luz: 3825 px de ancho, x = -1122. El fundido a la portada se centra en 22.8
      gsap.set("#v-dia", { transformOrigin: "0px 0px", scale: 3825 / AW, x: -1122, y: -11 });

      // 1. AACHEN 2026: eyebrow, línea desde el centro y título; salida suave antes del corte
      gsap.set("#aachen .flare", { scaleX: 0 });
      tl.fromTo("#aachen .eyebrow", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 2.85);
      tl.fromTo("#aachen .flare", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out", immediateRender: false }, 3.0);
      tl.fromTo("#aachen .titulo", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 3.15);
      tl.to("#aachen", { opacity: 0, duration: 0.5, ease: "power1.in" }, 5.05);

      // 2. Lower third: la barra se despliega, diagonal, nombre y jinete; sale antes del primer plano
      tl.fromTo("#lt .barra", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" }, 5.75);
      tl.fromTo("#lt .diag line", { attr: { x2: 0, y2: 150 } }, { attr: { x2: 74, y2: 0 }, duration: 0.4, ease: "power2.out" }, 5.95);
      tl.fromTo(["#lt .nombre", "#lt .sangre"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 6.05);
      tl.fromTo(["#lt .jinete", "#lt .meta"], { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out", stagger: 0.12 }, 6.3);
      // Si un texto no entra en su columna (a cada lado de la diagonal), se achica la fuente (como en footer-lote)
      const fit = (el, max) => {
        let s = parseFloat(getComputedStyle(el).fontSize);
        while (el.offsetWidth > max && s > 12) { s -= 1; el.style.fontSize = s + "px"; }
      };
      document.fonts.ready.then(() => {
        ["#lt .nombre", "#lt .sangre"].forEach((q) => fit(document.querySelector(q), 362));
        ["#lt .jinete", "#lt .meta"].forEach((q) => fit(document.querySelector(q), 340));
      });
      tl.to("#lt", { opacity: 0, duration: 0.5, ease: "power1.in" }, 17.85);

      // Sello: crece desde un punto, como en las placas; sale con el primer plano
      tl.fromTo("#sello img", { opacity: 0, scale: 0.04 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 5.75);
      tl.to("#sello", { opacity: 0, duration: 0.5, ease: "power1.in" }, 20.45);

      // 3. AACHEN 2026 / línea / EL LOGRO DEL AÑO sobre el primer plano
      gsap.set("#logro .flare", { scaleX: 0 });
      tl.fromTo("#logro .eyebrow", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 18.55);
      tl.fromTo("#logro .flare", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out", immediateRender: false }, 18.65);
      tl.fromTo("#logro .titulo", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 18.75);
      tl.to("#logro", { opacity: 0, duration: 0.5, ease: "power1.in" }, 20.45);

      // 4. Cierre por capas. La foto aérea se funde sobre el clip centrada en 22.8 (mismo cuadro y encuadre) y sigue con zoom lento
      tl.fromTo("#c-velos", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power1.inOut", immediateRender: false }, 22.3);
      tl.fromTo("#c-fondo", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none", immediateRender: false }, 22.65);
      tl.fromTo("#c-fondo", { scale: 1 }, { scale: 1.03, duration: 28 - 22.95, ease: "none", immediateRender: false }, 22.95);
      tl.fromTo("#c-agua", { opacity: 0 }, { opacity: 0.08, duration: 1.2, ease: "power1.inOut", immediateRender: false }, 22.6);
      tl.fromTo("#c-sello", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, 22.9);
      tl.fromTo("#c-caballo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out", immediateRender: false }, 23.2);
      tl.fromTo("#c-estrella", { opacity: 0, scale: 0.6, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 23.6);
      tl.fromTo("#c-textos .txt", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out", stagger: 0.12, immediateRender: false }, 23.7);

      // Salida a negro; el último medio segundo queda limpio
      tl.fromTo("#fin", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.in" }, 27.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
