    <script>
      const tl = gsap.timeline({ paused: true });
      // Salida a negro sobre el último lote, con su placa ya completa
      tl.fromTo("#fin", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.in" }, 35.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
